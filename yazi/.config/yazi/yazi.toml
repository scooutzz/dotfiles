[opener]
edit = [
	{ run = '$EDITOR %s', block = true, for = "unix" },
]
open = [
	{ run = 'xdg-open %s', orphan = true, for = "linux" },
]
view = [
	{ run = 'mupdf %s', orphan = true, for = "linux" },
]
vlc = [
	{ run = 'vlc %s', orphan = true, for = "linux" },
]
office = [
	{ run = 'onlyoffice-desktopeditors %s', orphan = true, for = "linux" },
]

[open]
rules = [
	{ mime = "text/*",          use = [ "edit", "open" ] },
	{ mime = "image/*",         use = [ "view", "open" ] },
	{ mime = "application/pdf", use = [ "view", "open" ] },
	{ mime = "video/*",         use = [ "vlc", "open" ] },
	{ mime = "audio/*",         use = [ "open" ] },
	{ url = "*.{xlsx,xlsm,xlsb,xls,docx,docm,dotx,doc,pptx,pptm,ppt,odt,ods,odp,rtf}", use = [ "office", "open" ] },
	{ url  = "*",               use = [ "open" ] },
]
